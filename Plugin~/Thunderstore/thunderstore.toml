[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
description = "JPOGTrex for Lethal Company."
websiteUrl = "https://github.com/347956/JPOGTrex"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"

[build]
icon = "../../Package/jpogtrex-icon.png"
readme = "../../Package/README.md"
outdir = "./Packages"

[[build.copy]]
source = "../bin/Release/netstandard2.1/JPOGTrex.dll"
target = "/plugins/JPOGTrex/"

# The Dusk export from the Unity project: the .duskmod next to the DLL, the content bundle in an Assets/ subfolder (Dusk only loads it from there).
[[build.copy]]
source = "../../AssetBundles/jpogtrexmainassets.duskmod"
target = "/plugins/JPOGTrex/"

[[build.copy]]
source = "../../AssetBundles/jpogtrexassets"
target = "/plugins/JPOGTrex/Assets/"

[[build.copy]]
source = "../../Package/CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]
[publish.categories]
# Get the list of categories from https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "bepinex", "clientside", "serverside", "monsters", "mods", ]